name: Betsson VLM Automated Tests

on:
  push:
    branches: [ main, master, feature ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome & Dependencies
        run: |
          npx playwright install chrome
          npx playwright install-deps chrome

      # Arrancar Google Chrome en el puerto 9222 en segundo plano dentro del servidor Xvfb
      - name: Start Background Chrome on Port 9222
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            google-chrome \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-betsson \
            --no-first-run \
            --no-default-browser-check \
            --disable-blink-features=AutomationControlled &
          sleep 3 # Esperar 3 segundos a que el puerto 9222 esté abierto

      # Ejecutar la suite de tests de Playwright conectándose al Chrome ya abierto
      - name: Run Playwright Test Suite
        run: npx playwright test
        env:
          MARKET: es
          CI: true
          CDP_URL: "http://127.0.0.1:9222"
          VLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          VLM_MODEL: "gemini-3.5-flash,gemini-3.1-flash-lite,gemini-flash-latest"
          VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
          BETSSON_ES_FUNDED_USER: ${{ secrets.BETSSON_ES_FUNDED_USER }}
          BETSSON_ES_FUNDED_PASS: ${{ secrets.BETSSON_ES_FUNDED_PASS }}
          BETSSON_ES_EMPTY_USER: ${{ secrets.BETSSON_ES_EMPTY_USER }}
          BETSSON_ES_EMPTY_PASS: ${{ secrets.BETSSON_ES_EMPTY_PASS }}
          BETSSON_ES_EXTRA_HEADERS: '{"x-obg-trusted-traffic":"1","x-obg-country-code":"ES","x-obg-origin":"ES","x-obg-internal":"1"}'

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betsson-vlm-report-es
          path: |
            report/html
            playwright-report
          retention-days: 30