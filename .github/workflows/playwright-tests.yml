name: Betsson VLM Automated Tests

on:
  push:
    branches: [ main, master, feature ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome & Dependencies
        run: |
          npx playwright install chrome
          npx playwright install-deps chrome

      # Arrancar Google Chrome en el puerto 9222 en segundo plano dentro del servidor Xvfb
      - name: Start Background Chrome on Port 9222
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            google-chrome \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-betsson \
            --no-first-run \
            --no-default-browser-check \
            --disable-blink-features=AutomationControlled &
          sleep 3 # Esperar 3 segundos a que el puerto 9222 esté abierto

      # Ejecutar la suite de tests de Playwright conectándose al Chrome ya abierto
      - name: Run Playwright Test Suite
        run: npx playwright test
        env:
          MARKET: es
          VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
          BETSSON_USERNAME_WITH_BALANCE: ${{ secrets.BETSSON_USERNAME_WITH_BALANCE }}
          BETSSON_PASSWORD: ${{ secrets.BETSSON_PASSWORD }}
          CI: true

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betsson-vlm-report-es
          path: |
            report/html
            playwright-report
          retention-days: 30