name: Betsson VLM Automated Tests

on:
  push:
    branches: [ main, master, feature ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar las dependencias exactas
      - name: Install dependencies
        run: npm ci

      # 4. Instalar los navegadores de Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 5. Ejecutar los tests fijando el mercado a 'es'
      - name: Run Playwright Test Suite
        run: npx playwright test
        env:
          MARKET: es
          VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
          BETSSON_USERNAME_WITH_BALANCE: ${{ secrets.BETSSON_USERNAME_WITH_BALANCE }}
          BETSSON_PASSWORD: ${{ secrets.BETSSON_PASSWORD }}

      # 6. Subir el reporte HTML y las evidencias visuales
      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always() # Se ejecuta siempre para analizar capturas y trazas aunque falle
        with:
          name: betsson-vlm-report-es
          path: |
            report/html
            playwright-report
          retention-days: 30